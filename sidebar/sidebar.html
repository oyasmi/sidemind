<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideMind</title>
    <link rel="stylesheet" href="../assets/css/ui.css" />
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/generation-settings.js"></script>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="brand"><img src="../icons/icon48.png" alt="" /><span id="sessionTitle">SideMind</span></div>
        <div class="header-right">
          <button id="newChatBtn" class="icon-btn" aria-label="New chat" title="New chat (Ctrl/⌘ + Shift + O)">
            <svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#plus"></use></svg>
          </button>
          <button
            id="chatHistoryBtn"
            class="icon-btn"
            aria-label="Chat history"
            title="Chat history"
            aria-haspopup="dialog"
          >
            <svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#clock"></use></svg>
          </button>
          <button id="optionsBtn" class="icon-btn" aria-label="Settings" title="Settings">
            <svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#cog"></use></svg>
          </button>
        </div>
        <div id="modelControl" class="model-control">
          <button id="modelSelector" class="model-selector" type="button" aria-label="Choose a model" aria-describedby="modelName modelProvider" aria-haspopup="dialog" aria-expanded="false" aria-controls="modelPickerPanel">
            <span class="model-selector-mark" aria-hidden="true"><svg class="ui-icon"><use href="../assets/icons.svg#robot"></use></svg></span>
            <span class="model-selector-text"><span id="modelName">Choose a model</span><span id="modelProvider">Your available models</span></span>
            <svg class="ui-icon model-selector-chevron" aria-hidden="true"><use href="../assets/icons.svg#chevron-down"></use></svg>
          </button>
          <div id="modelPickerPanel" class="model-picker-panel" role="dialog" aria-label="Choose a model" hidden>
            <div class="model-picker-search">
              <label class="sr-only" for="modelSearch">Search models</label>
              <input id="modelSearch" type="search" role="combobox" aria-autocomplete="list" aria-controls="modelOptions" aria-expanded="false" placeholder="Search models or providers…" autocomplete="off" spellcheck="false" />
            </div>
            <div id="modelOptions" class="model-options" role="listbox" aria-label="Available models"></div>
            <p id="modelPickerEmpty" class="model-picker-empty" role="status" hidden></p>
            <button id="manageModelsBtn" class="model-picker-manage" type="button"><svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#cog"></use></svg>Manage models</button>
          </div>
        </div>
      </header>

      <main class="chat-container">
        <div id="messagesList" class="messages-list" role="region" aria-label="Conversation"></div>
        <div id="welcomeMessage" class="welcome-message"></div>
        <button
          id="scrollBottomBtn"
          class="scroll-bottom-btn hidden"
          aria-label="View latest response"
        >
          <svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#arrow-down"></use></svg><span>View latest</span>
        </button>
        <div id="undoBar" class="undo-bar hidden" role="status">
          <span id="undoText" class="undo-text"></span
          ><button id="undoBtn" class="undo-btn" type="button">Undo</button>
        </div>
        <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>
      </main>

      <footer class="input-container">
        <div id="notifications" class="notification-region" role="status" aria-live="polite"></div>
        <div id="storageStatus" class="storage-status hidden" role="status">
          <span id="storageStatusText"></span><button id="retryStorageBtn" class="undo-btn" type="button">Retry save</button>
        </div>
        <div id="generationStatus" class="generation-status" role="status" aria-live="polite">
          Ready when you are
        </div>
        <div class="composer" id="composer">
          <input id="attachmentInput" type="file" multiple hidden />
          <div id="draftAttachments" class="attachment-list" aria-label="Attachments"></div>
          <div id="attachmentStatus" class="attachment-status" role="status" hidden><span>Preparing attachments…</span><button id="cancelAttachmentsBtn" type="button" class="undo-btn">Cancel</button></div>
          <label for="messageInput" class="sr-only">Message</label>
          <textarea
            id="messageInput"
            class="message-input reading-content"
            placeholder="Ask a question…"
            rows="2"
            aria-describedby="inputHint"
          ></textarea>
          <div class="composer-toolbar">
            <button id="attachBtn" class="icon-btn" type="button" aria-label="Attach images or files" title="Attach images or files"><svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#plus"></use></svg></button>
            <div class="role-control">
              <label for="systemPromptSelector">Role</label
              ><select id="systemPromptSelector" class="system-prompt-selector">
                <option value="default">Default</option>
              </select>
            </div>
            <button
              id="sendBtn"
              class="icon-btn send-btn"
              aria-label="Send message"
              title="Send message"
              disabled
              data-state="send"
            >
              <svg class="ui-icon send-icon" aria-hidden="true"><use href="../assets/icons.svg#arrow-up"></use></svg>
              <svg class="ui-icon stop-icon" aria-hidden="true"><use href="../assets/icons.svg#stop"></use></svg>
            </button>
          </div>
        </div>
        <p id="inputHint" class="input-hint">Enter to send · Shift + Enter for a new line</p>
      </footer>
    </div>

    <dialog id="chatHistoryDropdown" class="chat-history-dropdown" aria-labelledby="historyTitle">
      <div class="modal-panel">
        <div class="modal-header">
          <h3 id="historyTitle">Your conversations</h3>
          <button class="close-btn icon-btn" aria-label="Close history">
            <svg class="ui-icon" aria-hidden="true"><use href="../assets/icons.svg#close"></use></svg>
          </button>
        </div>
        <div class="history-search">
          <label for="historySearch" class="sr-only">Search conversations</label
          ><input
            id="historySearch"
            type="search"
            placeholder="Search titles and messages…"
            autocomplete="off"
          />
        </div>
        <div class="dropdown-content">
          <div id="chatHistoryList" class="chat-history-list"></div>
        </div>
        <div id="historyUndo" class="history-undo hidden">
          <span id="historyUndoText"></span
          ><button id="historyUndoBtn" class="undo-btn">Undo</button>
        </div>
      </div>
    </dialog>
    <dialog id="attachmentPreviewDialog" class="attachment-preview-dialog" aria-label="Image preview">
      <form method="dialog"><button class="btn btn-small" aria-label="Close image preview">Close</button></form>
      <img alt="" />
    </dialog>
    <script src="marked.umd.js"></script>
    <script src="highlight.min.js"></script>
    <script src="responses.js"></script>
    <script src="attachments.js"></script>
    <script src="sidebar.js"></script>
  </body>
</html>
